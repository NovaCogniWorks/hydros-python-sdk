# Pump ODD-DMPC runtime configuration.
# 只保留生产调度和边缘求解当前实际读取的运行参数；站点、拓扑、机组曲线和传感器映射在 mpc_static_config.yaml。
flow_depart:
  # 离线流量分配表生成时的流量搜索步长，单位 m3/s。
  step_q: 2.0
  # 离线流量分配表生成时的扬程搜索步长，单位 m。
  step_h: 0.4
scheduling:
  # 上层调度预测时域长度，单位 hour。
  horizon_hours: 72
  # 调度步长，单位 hour。
  dt_hours: 1
  # 末级泵站目标平均流量，单位 m3/s。
  target_avg_flow_last_station: 50
runtime:
  odd:
    # ODD1 模式允许的流量误差阈值，单位 m3/s。
    odd1_flow_tolerance: 4
    # ODD1 模式允许的水位误差阈值，单位 m。
    odd1_level_tolerance: 0.15
    # ODD3 模式允许的流量误差阈值，单位 m3/s。
    odd3_flow_tolerance: 8
    # ODD3 模式允许的水位误差阈值，单位 m。
    odd3_level_tolerance: 0.8
  search:
    # 上层候选方案的扬程搜索容差，单位 m。
    head_search_tolerance: 0.35
  upper_scheduler:
    # 上层调度对水位偏差的修正增益。
    upper_level_correction_gain: 1.0
    # 上层调度对流量偏差的修正增益。
    upper_flow_bias_correction_gain: 0.0
    # 上层调度优化方法。
    upper_mpc_optimization_method: greedy
  lower_controller:
    # 下层局部控制滚动时域长度，单位 step。
    control_horizon_lower: 10
    # 下层目标函数中的流量误差权重。
    lower_flow_weight: 3.0
    # 下层目标函数中的水位误差权重。
    lower_level_weight: 2.5
    # 下层目标函数中的启停切换权重。
    lower_switch_weight: 0.0
    # 下层目标函数中的调整次数权重。
    lower_adjust_count_weight: 0
  observer:
    # 扰动观测器增益。
    observer_gain: 0.3
    # 扰动观测器平滑系数。
    observer_smoothing: 0.0
    # 扰动预测窗口长度，单位 hour。
    disturbance_forecast_window_hours: 1.0
    # 扰动预测方法。
    disturbance_forecast_method: hold
